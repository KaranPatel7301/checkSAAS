name: saas-scout

# Runs the scanner on a schedule in the cloud, so it never depends on
# your laptop being awake. Free: this repo's runs stay well under the
# GitHub Actions free allowance.

on:
  schedule:
    # GitHub cron is always UTC. These three map to ~7am / 1pm / 7pm
    # US Eastern during summer (EDT). In winter they land an hour
    # earlier, which is harmless for a deal scanner.
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:   # adds a "Run workflow" button for on-demand runs

concurrency:
  group: saas-scout
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lets the job commit the dedup file back to the repo
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          # REQUIRED secrets (repo Settings -> Secrets and variables -> Actions).
          # These are all you need for email to work:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}   # smtp.gmail.com
          SMTP_PORT: ${{ secrets.SMTP_PORT }}   # 587
          SMTP_USER: ${{ secrets.SMTP_USER }}   # karanpatel7301@gmail.com
          SMTP_PASS: ${{ secrets.SMTP_PASS }}   # Gmail App Password (16 chars)
          # OPTIONAL. Digest recipient defaults to karanpatel7301@gmail.com.
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          # Flippa, Microns and Reddit all run with NO API keys at all.
          # Point the dedup memory at a repo file so it survives each run.
          SAAS_SCOUT_SEEN: seen.json
          SAAS_SCOUT_HISTORY: deal_history.json
        run: python saas_scout.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # Dormancy heartbeat: GitHub auto-disables scheduled workflows after 60
      # days with NO repo commits. A dry spell (or a silently broken scraper)
      # produces zero hits -> no seen.json change -> no commit -> eventual
      # dormancy, with no warning. Writing a timestamp EVERY run guarantees a
      # commit 3x/day, so the schedule can never go dark.
      #
      # ONE commit per run: fold last_run.txt + seen.json into the SAME commit
      # and push once. Two separate pushes in one run can race the concurrency
      # guard (group: saas-scout) and corrupt / miss the dedup update.
      - name: Heartbeat + persist dedup memory
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last_run.txt
          git config user.name "saas-scout-bot"
          git config user.email "actions@github.com"
          git add .github/last_run.txt seen.json deal_history.json
          # last_run.txt always changes, so this commit always succeeds ->
          # a commit lands on main on every single run (one commit, one push).
          git commit -m "heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          # Rebase in case a manual push moved main since checkout, then push.
          git pull --rebase --autostash origin main || true
          git push
